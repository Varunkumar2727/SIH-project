# GeoCadastral AI - Training Configuration
# Primary Task: Cadastral / Parcel Boundary Delineation
# Dataset: CadastreVision Benchmark Subset

experiment:
  name: "geocadastral_cadastral_boundary_v1"
  version: "1.0.0"
  task: "cadastral_boundary_segmentation"
  seed: 42

dataset:
  name: "CadastreVision"
  data_root: "data/cadastrevision"
  image_dir: "images"
  mask_dir: "masks"
  image_size: 512
  overlap_ratio: 0.15
  channels: 3
  classes:
    0: "background"
    1: "cadastral_boundary"
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    leakage_prevention: "scene_id"

model:
  architecture: "CadastralBoundaryUNet"
  encoder_channels: [32, 64, 128, 256, 512]
  in_channels: 3
  num_classes: 1 # Binary boundary probability map
  activation: "sigmoid"

training:
  epochs: 25
  batch_size: 2 # Safe for 4GB VRAM / Colab T4
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss: "BCEDiceLoss" # Loss = 0.5 * BCE + 0.5 * Dice
  bce_weight: 0.5
  dice_weight: 0.5
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  early_stopping_patience: 7
  mixed_precision: true

export:
  onnx_filename: "geocadastral_cadastral_boundary_v1.onnx"
  metadata_filename: "geocadastral_cadastral_boundary_v1_meta.json"
  target_dir: "backend/models"
  opset_version: 17
  dynamic_axes:
    input: {0: "batch_size", 2: "height", 3: "width"}
    output: {0: "batch_size", 2: "height", 3: "width"}
